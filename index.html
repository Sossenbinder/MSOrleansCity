<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSOrleansCity</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
      }

      #city {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #dbe4f0;
      }

      .panel {
        position: absolute;
        pointer-events: auto;
        background: rgba(10, 14, 21, 0.86);
        border: 1px solid #26313f;
        border-radius: 10px;
        padding: 14px 16px;
        backdrop-filter: blur(8px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }

      .controls {
        top: 16px;
        left: 16px;
        width: 312px;
      }

      .tour {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(620px, calc(100vw - 40px));
      }

      .tour.hidden {
        display: none;
      }

      .tour-progress {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #5f708a;
      }

      .tour-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .tour-actions button:last-child {
        margin-left: auto;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      button.wide {
        width: 100%;
        margin-bottom: 10px;
      }

      .section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: #8b9bb0;
        margin-bottom: 6px;
      }

      .scenarios {
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #26313f;
      }

      button.scenario {
        display: block;
        width: 100%;
        text-align: left;
        padding: 5px 8px;
        margin-bottom: 3px;
        line-height: 1.35;
      }

      button.scenario b {
        display: block;
        font-weight: 600;
        font-size: 12.5px;
      }

      button.scenario span {
        display: block;
        font-size: 11px;
        color: #8b9bb0;
      }

      .note {
        background: #16202b;
        border-left: 2px solid #6fa8ff;
        border-radius: 0 6px 6px 0;
        padding: 8px 10px;
        margin-bottom: 10px;
        font-size: 11.5px;
        line-height: 1.45;
      }

      .note.hidden {
        display: none;
      }

      .note b {
        display: block;
        margin-bottom: 3px;
      }

      .note span {
        color: #8b9bb0;
      }

      .inspector {
        top: 16px;
        right: 16px;
        width: 340px;
        max-height: calc(60vh);
      }

      .eventlog {
        bottom: 16px;
        right: 16px;
        width: 380px;
        max-height: 34vh;
        display: flex;
        flex-direction: column;
        padding: 10px 12px;
        overflow: hidden;
      }

      .eventlog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: #8b9bb0;
        margin-bottom: 6px;
        flex: 0 0 auto;
      }

      .eventlog-body {
        overflow-y: auto;
        font:
          11.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        flex: 1 1 auto;
        min-height: 0;
      }

      .ev {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ev .t {
        color: #4c5b71;
        display: inline-block;
        min-width: 46px;
      }

      .ev-normal {
        color: #cbd7e6;
      }
      .ev-good {
        color: #5fd68a;
      }
      .ev-warn {
        color: #ffb454;
      }
      .ev-bad {
        color: #ff7b7b;
      }
      .ev-dim {
        color: #7c8ba1;
      }

      button.tiny {
        padding: 1px 7px;
        font-size: 10.5px;
        color: #7c8ba1;
      }

      button.tiny.on {
        color: #9dc4ff;
        border-color: #3a6a95;
      }

      .inspector.hidden {
        display: none;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 16px;
        letter-spacing: 0.02em;
      }

      h2 {
        margin: 6px 0 2px;
        font-size: 15px;
      }

      h3 {
        margin: 14px 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: #8b9bb0;
      }

      p {
        margin: 6px 0;
      }

      .hint,
      .subtitle {
        color: #8b9bb0;
        font-size: 12px;
        margin: 0 0 8px;
      }

      .caveat {
        color: #b99a4a;
        font-size: 11px;
        line-height: 1.45;
        margin: 0 0 12px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .row label {
        color: #8b9bb0;
        font-size: 12px;
        min-width: 46px;
      }

      input[type="text"],
      select {
        flex: 1;
        min-width: 0;
        background: #121a25;
        border: 1px solid #2f3d4f;
        border-radius: 6px;
        color: #dbe4f0;
        padding: 6px 8px;
        font: inherit;
      }

      input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: #6fa8ff;
      }

      button {
        background: #1b2430;
        border: 1px solid #2f3d4f;
        border-radius: 6px;
        color: #dbe4f0;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: #4a5d75;
      }

      button.primary {
        background: #24425f;
        border-color: #3a6a95;
      }

      .speed-label {
        min-width: 44px;
        color: #8b9bb0;
        font-variant-numeric: tabular-nums;
      }

      .stats {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #26313f;
        color: #8b9bb0;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .stats b {
        color: #dbe4f0;
      }

      .stats .clock {
        margin-top: 4px;
        color: #5f708a;
      }

      .silos {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #26313f;
      }

      .silo-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        padding: 2px 0;
        font-variant-numeric: tabular-nums;
      }

      .silo-row .addr {
        flex: 1;
        color: #b6c3d4;
      }

      .silo-row .counts {
        color: #5f708a;
        min-width: 74px;
        text-align: right;
      }

      .silo-row.is-dead .addr {
        color: #5f708a;
        text-decoration: line-through;
      }

      .silo-row .kill {
        padding: 1px 6px;
        font-size: 10.5px;
        color: #8b9bb0;
        border-color: #3a2a2a;
      }

      .silo-row .kill:hover {
        color: #ff8b8b;
        border-color: #7a3a3a;
      }

      .bad {
        color: #ff7b7b;
      }

      .warn {
        color: #ffb454;
      }

      input[type="checkbox"] {
        accent-color: #6fa8ff;
        width: 15px;
        height: 15px;
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: 0 0 auto;
      }

      .legend {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #26313f;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #8b9bb0;
        padding: 2px 0;
      }

      .inspector .accent {
        height: 3px;
        border-radius: 2px;
        margin-bottom: 10px;
      }

      .inspector .close {
        float: right;
        background: none;
        border: none;
        color: #8b9bb0;
        font-size: 18px;
        line-height: 1;
        padding: 0 2px;
      }

      dl {
        margin: 8px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 12px;
      }

      dt {
        color: #8b9bb0;
      }

      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
        word-break: break-word;
      }

      code {
        font:
          11.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #9dc4ff;
        word-break: break-word;
      }

      code.type {
        display: block;
        background: #121a25;
        border: 1px solid #26313f;
        border-radius: 6px;
        padding: 6px 8px;
      }

      .knob {
        border-top: 1px solid #1f2937;
        padding: 8px 0 2px;
      }

      .knob-label {
        font-weight: 600;
        font-size: 12px;
      }

      .knob-values {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 11px;
        color: #8b9bb0;
        margin-top: 3px;
      }

      .knob p {
        font-size: 11.5px;
        color: #8b9bb0;
        margin: 5px 0 0;
      }

      .unverified {
        color: #b99a4a;
      }

      .src {
        color: #5f708a;
      }
    </style>
  </head>
  <body>
    <canvas id="city"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
